[custom]
; Based on ACL4SSR_Online_Mini_Ai.ini; reviewed 2026-10-16.
; Subconverter external config for MiSub. UTF-8, no BOM.
; First match wins. TG regions precede TG fallback and all general Internet rules.
; Play downloads override UnBan; AI and YouTube precede Google.
; See docs/Telegram-routing-audit.md for evidence, overlap and runtime limits.
; No GooglePlay.list URL: that ACL4SSR path returned HTTP 404.

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
; Destination IP routing: never place the broad/domain Telegram lists first.
ruleset=📲 TG亚太,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_APAC.list
ruleset=📲 TG北美,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_US.list
ruleset=📲 TG欧洲,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_EU.list
ruleset=📲 TG兜底,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_Other.list
ruleset=📲 TG兜底,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; Play service and download endpoints; early exceptions to direct/advertising lists.
ruleset=📢 谷歌,[]DOMAIN,play.google.com
ruleset=📢 谷歌,[]DOMAIN,play.googleapis.com
ruleset=📢 谷歌,[]DOMAIN,play-fe.googleapis.com
ruleset=📢 谷歌,[]DOMAIN,android.clients.google.com
ruleset=📢 谷歌,[]DOMAIN,android.apis.google.com
ruleset=📢 谷歌,[]DOMAIN,android.googleapis.com
ruleset=📢 谷歌,[]DOMAIN,play-lh.googleusercontent.com
ruleset=📢 谷歌,[]DOMAIN,play.googleusercontent.com
ruleset=📢 谷歌,[]DOMAIN,redirector.gvt1.com
ruleset=📢 谷歌,[]DOMAIN,dl.google.com
ruleset=📢 谷歌,[]DOMAIN,dl.l.google.com
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list
; AI.list covers most OpenAi.list entries. Keep only the three missing entries inline.
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,sentry.io
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,stripe.com
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=📢 谷歌,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📢 谷歌,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=📢 谷歌,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=📢 谷歌,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=📢 谷歌,[]DOMAIN-SUFFIX,android.com
ruleset=📢 谷歌,[]DOMAIN-SUFFIX,googleplay.com
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; Keep groups minimal; first choice is the default.
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=📢 谷歌`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择

; Ordered regex matches first, explicit general group keeps no-match cases nonempty.
; Keep MiSub/Subconverter sort=false to preserve the initial preference.
custom_proxy_group=📲 TG亚太`select`(新加坡|狮城|獅城|Singapore|SINGAPORE|singapore|(^|[^A-Za-z])(SG|sg|SGP|sgp)([^A-Za-z]|$)|🇸🇬)`[]🚀 节点选择`.*
custom_proxy_group=📲 TG北美`select`(美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|迈阿密|邁阿密|United States|USA|(^|[^A-Za-z])(US|us)([^A-Za-z]|$)|🇺🇸|🇺🇲)`[]🚀 节点选择`.*
custom_proxy_group=📲 TG欧洲`select`(荷兰|荷蘭|德国|德國|英国|英國|法国|法國|芬兰|芬蘭|瑞典|瑞士|挪威|欧洲|歐洲|Netherlands|Germany|Frankfurt|London|Amsterdam|Europe|Helsinki|(^|[^A-Za-z])(NL|nl|DE|de|UK|uk|GB|gb|FR|fr|FI|fi|EU|eu)([^A-Za-z]|$)|🇳🇱|🇩🇪|🇬🇧|🇫🇷|🇫🇮|🇸🇪|🇨🇭|🇳🇴)`[]🚀 节点选择`.*
custom_proxy_group=📲 TG兜底`select`[]🚀 节点选择`[]📲 TG亚太`[]📲 TG北美`[]📲 TG欧洲`.*

enable_rule_generator=true
overwrite_original_rules=true
