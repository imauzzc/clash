[custom]
; Based on ACL4SSR_Online_Mini_Ai.ini.
; Subconverter external config for MiSub. UTF-8, no BOM.
; First match wins. TG regions precede TG fallback and all general Internet rules.
; AI and YouTube precede general Google rules.
; See docs/Telegram-routing.md for evidence, overlap and runtime limits.

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
; Explicit site policy before other remote lists; includes subdomains.
ruleset=🌙 私享空间,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Private_Space.list
ruleset=🎬 Emby,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Emby.list
; Destination IP routing: never place the broad/domain Telegram lists first.
ruleset=📲 TG亚太,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_APAC.list
ruleset=📲 TG北美,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_US.list
ruleset=📲 TG兜底,https://raw.githubusercontent.com/imauzzc/clash/main/rules/Telegram_Other.list
ruleset=📲 TG兜底,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list
; AI.list covers most OpenAi.list entries. Keep only the three missing entries inline.
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,sentry.io
ruleset=💬 Ai平台,[]DOMAIN-SUFFIX,stripe.com
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
; Google certificate validation domains otherwise match GEOIP,CN and time out on direct.
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,pki.goog
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; Reusable regional node collections. select = manual selection within a region.
; Regional selectors include same-region url-test subgroups; no cross-region fallback.
; Keep sort=false to preserve the first matching regional node as initial choice.
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点``[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🌐 DNS 出口`url-test`(香港|台湾|台灣|日本|新加坡|狮城|HK|TW|JP|SG|🇭🇰|🇹🇼|🇯🇵|🇸🇬)`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🇭🇰 香港节点`select`(香港|Hong Kong|HONG KONG|HongKong|hongkong|(^|[^A-Za-z])(HK|hk|HKG|hkg)([^A-Za-z]|$)|🇭🇰)`[]🇭🇰 香港自动测速`[]REJECT
custom_proxy_group=🇭🇰 香港自动测速`url-test`(香港|Hong Kong|HONG KONG|HongKong|hongkong|(^|[^A-Za-z])(HK|hk|HKG|hkg)([^A-Za-z]|$)|🇭🇰)`[]REJECT`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🇨🇳 台湾节点`select`(台湾|台灣|Taiwan|TAIWAN|taiwan|(^|[^A-Za-z])(TW|tw|TWN|twn)([^A-Za-z]|$)|🇹🇼)`[]🇨🇳 台湾自动测速`[]REJECT
custom_proxy_group=🇨🇳 台湾自动测速`url-test`(台湾|台灣|Taiwan|TAIWAN|taiwan|(^|[^A-Za-z])(TW|tw|TWN|twn)([^A-Za-z]|$)|🇹🇼)`[]REJECT`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🇯🇵 日本节点`select`(日本|东京|東京|大阪|Japan|JAPAN|japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|jp|JPN|jpn)(v6|V6)?([^A-Za-z]|$)|🇯🇵)`[]🇯🇵 日本自动测速`[]REJECT
custom_proxy_group=🇯🇵 日本自动测速`url-test`(日本|东京|東京|大阪|Japan|JAPAN|japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|jp|JPN|jpn)(v6|V6)?([^A-Za-z]|$)|🇯🇵)`[]REJECT`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🇸🇬 新加坡节点`select`(新加坡|狮城|獅城|Singapore|SINGAPORE|singapore|(^|[^A-Za-z])(SG|sg|SGP|sgp)([^A-Za-z]|$)|🇸🇬)`[]🇸🇬 新加坡自动测速`[]REJECT
custom_proxy_group=🇸🇬 新加坡自动测速`url-test`(新加坡|狮城|獅城|Singapore|SINGAPORE|singapore|(^|[^A-Za-z])(SG|sg|SGP|sgp)([^A-Za-z]|$)|🇸🇬)`[]REJECT`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=🇺🇲 美国节点`select`(美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|迈阿密|邁阿密|United States|USA|(^|[^A-Za-z])(US|us)([^A-Za-z]|$)|🇺🇸|🇺🇲)`[]🇺🇲 美国自动测速`[]REJECT
custom_proxy_group=🇺🇲 美国自动测速`url-test`(美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|迈阿密|邁阿密|United States|USA|(^|[^A-Za-z])(US|us)([^A-Za-z]|$)|🇺🇸|🇺🇲)`[]REJECT`https://www.gstatic.com/generate_204`300,,20
custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点``[]DIRECT`.*
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点``[]DIRECT`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇲 美国节点`
